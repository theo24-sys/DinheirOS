<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanceOS Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Simple glassmorphism effect */
    .glass {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.15);
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-4xl w-full glass p-6 shadow-lg">
    <h1 class="text-3xl font-bold text-center mb-6">FinanceOS Dashboard</h1>
    <div id="wallets" class="grid gap-4 md:grid-cols-2"></div>
  </div>

  <script>
    // Fetch wallet status from backend
    async function loadWallets() {
      const resp = await fetch('/api/status');
      if (!resp.ok) return console.error('Failed to load status');
      const data = await resp.json(); // expects { wallets: [{name, used_today, daily_limit, used_this_week, weekly_max_count, balance, rollover}] 
      const container = document.getElementById('wallets');
      container.innerHTML = '';
      data.wallets.forEach(w => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-lg shadow hover:shadow-lg transition';
        card.innerHTML = `
          <h2 class="text-xl font-semibold mb-2">${w.name}</h2>
          <p>Daily: ${w.used_today}/${w.daily_limit}</p>
          <p>Weekly: ${w.used_this_week}/${w.weekly_max_count}</p>
          <p>Balance: ${w.balance}/${w.weekly_amount}</p>
          <button class="mt-2 w-full bg-blue-600 text-white py-1 rounded hover:bg-blue-700" data-wallet="${w.name}">Request Access</button>
        `;
        // attach click handler
        const btn = card.querySelector('button');
        btn.addEventListener('click', async () => {
          const amount = w.weekly_amount / w.weekly_max_count; // simple per‑access amount
          const res = await fetch('/api/withdraw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet: w.name, amount })
          });
          const result = await res.json();
          alert(result.message || result.error || 'Request sent');
          loadWallets(); // refresh UI
        });
        container.appendChild(card);
      });
    }
    loadWallets();
    // Optional auto‑refresh every 30 s
    setInterval(loadWallets, 30000);
  </script>
</body>
</html>
