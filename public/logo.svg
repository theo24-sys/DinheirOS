<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circuit patterns -->
  <g stroke="#10b981" stroke-width="1" fill="none" opacity="0.2">
    <path d="M 20 20 L 80 20 L 80 60" />
    <path d="M 180 30 L 120 30 L 120 80" />
    <path d="M 30 180 L 30 120 L 90 120" />
    <path d="M 170 170 L 120 170 L 120 100" />
  </g>
  
  <!-- Circles for circuit nodes -->
  <g fill="#10b981" opacity="0.15">
    <circle cx="20" cy="20" r="2" />
    <circle cx="80" cy="20" r="2" />
    <circle cx="80" cy="60" r="2" />
    <circle cx="180" cy="30" r="2" />
    <circle cx="120" cy="30" r="2" />
    <circle cx="120" cy="80" r="2" />
    <circle cx="30" cy="180" r="2" />
    <circle cx="30" cy="120" r="2" />
    <circle cx="90" cy="120" r="2" />
    <circle cx="170" cy="170" r="2" />
    <circle cx="120" cy="170" r="2" />
    <circle cx="120" cy="100" r="2" />
  </g>
  
  <!-- Main icon: stylized wallet/money symbol -->
  <g transform="translate(100, 100)">
    <!-- Outer wallet shape -->
    <rect x="-35" y="-25" width="70" height="50" rx="5" fill="none" stroke="url(#logoGradient)" stroke-width="2.5"/>
    
    <!-- Coin/money inside -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#logoGradient)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="url(#logoGradient)" opacity="0.3"/>
    
    <!-- $ symbol inside coin -->
    <text x="0" y="6" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle" dominant-baseline="middle" font-family="Arial">$</text>
    
    <!-- Vertical line accent -->
    <line x1="0" y1="-35" x2="0" y2="35" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Glow effect -->
  <g filter="url(#glow)" opacity="0.3">
    <circle cx="100" cy="100" r="50" fill="#10b981"/>
  </g>
  
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>