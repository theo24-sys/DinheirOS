<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DinheirOS - System Interface</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg-color: #0a0a0a;
      --card-bg: #111111;
      --border-color: #222222;
      --accent-color: #00ff88;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --alert-color: #ff3333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .header {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      color: var(--text-primary);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      position: relative;
    }

    .wallet-name {
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0 0 1rem 0;
    }

    .weekly-amount {
      color: var(--accent-color);
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .pip-row {
      display: flex;
      gap: 6px;
      margin-bottom: 1rem;
    }

    .pip {
      width: 12px;
      height: 12px;
      border: 1px solid var(--text-secondary);
      border-radius: 2px;
    }

    .pip.filled {
      background-color: var(--text-primary);
      border-color: var(--text-primary);
    }

    .lock-state {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      color: var(--alert-color);
      font-weight: 700;
      font-size: 0.875rem;
      letter-spacing: 1px;
    }

    .per-access {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000000;
      border: none;
      padding: 1rem;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .btn:disabled {
      background-color: var(--border-color);
      color: var(--text-secondary);
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">SYSTEM_CORE // FinanceOS</div>
    <div id="wallets" class="grid"></div>
  </div>

  <script>
    // Fetch wallet status from backend
    async function loadWallets() {
      const resp = await fetch('/api/status');
      if (!resp.ok) return console.error('Failed to load status');
      const data = await resp.json(); // expects { wallets: [{name, used_today, daily_limit, used_this_week, weekly_max_count, balance, rollover}] 
      const container = document.getElementById('wallets');
      container.innerHTML = '';
      data.wallets.forEach(w => {
        const amount = w.weekly_amount / w.weekly_max_count;
        const isLocked = w.used_this_week >= w.weekly_max_count;

        const card = document.createElement('div');
        card.className = 'card';
        
        let pipsHtml = '';
        for (let i = 0; i < w.weekly_max_count; i++) {
          pipsHtml += `<div class="pip ${i < w.used_this_week ? 'filled' : ''}"></div>`;
        }

        card.innerHTML = `
          ${isLocked ? '<div class="lock-state">LOCKED</div>' : ''}
          <h2 class="wallet-name">${w.name}</h2>
          <div class="weekly-amount">WEEKLY: ${w.balance}/${w.weekly_amount}</div>
          <div class="pip-row">${pipsHtml}</div>
          <div class="per-access">PER ACCESS: ${amount.toFixed(2)}</div>
          <button class="btn" data-wallet="${w.name}" ${isLocked ? 'disabled' : ''}>Request Access</button>
        `;

        // attach click handler
        const btn = card.querySelector('button');
        btn.addEventListener('click', async () => {
          const res = await fetch('/api/withdraw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet: w.name, amount })
          });
          const result = await res.json();
          alert(result.message || result.error || 'Request sent');
          loadWallets(); // refresh UI
        });
        container.appendChild(card);
      });
    }
    loadWallets();
    // Optional auto‑refresh every 30 s
    setInterval(loadWallets, 30000);
  </script>
</body>
</html>
